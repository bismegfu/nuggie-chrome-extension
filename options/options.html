<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuggie Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>🐱 Nuggie Settings</h1>
      <p class="subtitle">Customise your break reminders</p>
    </header>

    <section class="card">
      <h2>Timer</h2>
      <div class="field">
        <label for="workInterval">Work interval (minutes)</label>
        <input type="number" id="workInterval" min="1" max="480" value="60" />
      </div>
      <div class="field">
        <label for="breakDuration">Break duration (minutes)</label>
        <input type="number" id="breakDuration" min="1" max="60" value="1" />
      </div>
      <div class="field">
        <label for="instantSkip">Allow instant skip</label>
        <input type="checkbox" id="instantSkip" />
      </div>
    </section>

    <section class="card">
      <h2>Photo Order</h2>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="photoOrder" value="random" checked />
          <span>Random</span>
          <small>Each visit is a surprise</small>
        </label>
        <label class="radio-label">
          <input type="radio" name="photoOrder" value="sequential" />
          <span>Sequential</span>
          <small>Cycles through in order</small>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Cat Photos</h2>
      <div id="photoGrid" class="photo-grid"></div>
      <label class="upload-btn">
        <input type="file" id="photoUpload" accept="image/png,image/jpeg,image/webp" multiple hidden />
        + Add photos
      </label>
    </section>

    <div class="actions">
      <span id="saveStatus" class="save-status"></span>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
