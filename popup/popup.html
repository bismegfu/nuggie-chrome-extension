<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuggie</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="header">
      <span class="paw">🐾</span>
      <span class="title">Nuggie</span>
    </div>

    <div id="status" class="status">
      <div class="label">Next cat in</div>
      <div id="countdown" class="countdown">–</div>
    </div>

    <div id="break-active" class="break-active hidden">
      <div class="break-icon">🐱</div>
      <div class="break-text">Break time!</div>
    </div>

    <a id="settingsLink" class="settings-link">Settings</a>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
